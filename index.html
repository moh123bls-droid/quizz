<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600&family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

#fhq {
  --ink: #17302A; --forest: #1D4637; --forest-deep: #12302A; --moss: #5F7A52;
  --sage: #DFE7D5; --sage-soft: #EEF2E7; --paper: #F7F3EA; --card: #FFFDF8;
  --line: #E2DCCB; --muted: #5C6B64; --gold: #C7A15F; --clay: #A8452A; --clay-soft: #F6E4DB;
  --display: 'El Messiri', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  direction: rtl; text-align: right; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  padding: clamp(0px, 3vw, 32px) 0; scroll-margin-top: 80px;
}
#fhq *, #fhq *::before, #fhq *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
#fhq h1, #fhq h2, #fhq h3 { font-family: var(--display) !important; color: inherit; letter-spacing: 0; text-transform: none; font-weight: 700; }
#fhq p { color: inherit; font-family: inherit; letter-spacing: 0; }
#fhq button, #fhq a.fh-btn { font-family: var(--body) !important; letter-spacing: 0; text-transform: none; touch-action: manipulation; cursor: pointer; }
#fhq button { appearance: none; -webkit-appearance: none; background: none; border: 0; color: inherit; min-width: 0; min-height: 0; box-shadow: none; text-align: inherit; }
#fhq :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#fhq [tabindex="-1"]:focus { outline: none; }
#fhq img { display: block; max-width: 100%; height: auto; }
#fhq .fh-shell { width: 100%; max-width: 560px; margin: 0 auto; background: var(--paper); }
@media (min-width: 600px) { #fhq .fh-shell { border-radius: 24px; border: 1px solid var(--line); overflow: clip; } }
#fhq .fh-screen { animation: fh-in .35s ease both; }
@keyframes fh-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Primary button */
#fhq .fh-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 12px 22px; background: var(--forest) !important; color: #FFFDF8 !important; border-radius: 14px; font-size: 17px; font-weight: 700; text-decoration: none !important; text-align: center; transition: background .2s, transform .12s; }
#fhq .fh-btn:active { transform: scale(.985); }
#fhq .fh-btn:disabled { background: #BFC8BD !important; cursor: not-allowed; }
@media (hover: hover) { #fhq .fh-btn:not(:disabled):hover { background: var(--forest-deep) !important; } }
#fhq .fh-btn svg { width: 18px; height: 18px; flex: none; }
#fhq .fh-btn--light { background: #FFFDF8 !important; color: var(--forest-deep) !important; }
@media (hover: hover) { #fhq .fh-btn--light:not(:disabled):hover { background: var(--sage) !important; } }

/* Landing */
#fhq .fh-land { padding: 28px 22px 26px; text-align: center; }
#fhq .fh-badge { display: inline-block; padding: 6px 15px; background: var(--sage); color: var(--forest-deep); border-radius: 100px; font-size: 13px; font-weight: 700; }
#fhq .fh-logo { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 48px; line-height: 1; direction: ltr; text-align: center; color: var(--forest); margin: 22px 0 18px; }
#fhq .fh-land h1 { font-size: clamp(29px, 8vw, 36px); line-height: 1.3; color: var(--ink); }
#fhq .fh-land h1 span { white-space: nowrap; color: var(--forest); background: linear-gradient(transparent 68%, var(--sage) 68%); }
#fhq .fh-lead { margin: 10px auto 20px; max-width: 28em; font-size: 16px; line-height: 1.7; color: var(--muted); }
#fhq .fh-trustbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px 6px; margin-bottom: 18px; background: var(--sage-soft); border-radius: 14px; }
#fhq .fh-trustbar b { display: block; font-size: 17px; font-weight: 700; color: var(--forest); line-height: 1.3; }
#fhq .fh-trustbar span { display: block; font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.35; margin-top: 2px; }
#fhq .fh-meta { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }

/* Question */
#fhq .fh-q { padding: 18px 20px 28px; min-height: 560px; display: flex; flex-direction: column; }
#fhq .fh-top { display: flex; align-items: center; gap: 12px; }
#fhq .fh-back { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--forest); background: var(--sage-soft); }
#fhq .fh-back svg { width: 18px; height: 18px; }
#fhq .fh-strand { flex: 1; min-width: 0; width: 100%; height: 34px; display: block; overflow: visible; }
#fhq .fh-strand .bg { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
#fhq .fh-strand .fg { fill: none; stroke: var(--forest); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; transition: stroke-dashoffset .6s cubic-bezier(.3,.7,.3,1); }
#fhq .fh-strand .bulb { fill: var(--forest); }
#fhq .fh-zone { margin-top: 22px; font-size: 13px; font-weight: 700; color: var(--moss); }
#fhq .fh-q h2 { font-size: clamp(25px, 6.6vw, 30px); line-height: 1.32; margin-top: 2px; color: var(--ink); }
#fhq .fh-hint { margin-top: 6px; font-size: 15px; color: var(--muted); }
#fhq .fh-note { margin-top: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.55; background: var(--sage-soft); border-inline-start: 3px solid var(--moss); border-radius: 4px; color: var(--ink); }
#fhq .fh-opts { display: grid; gap: 10px; margin-top: 20px; }
#fhq .fh-opt { display: flex; align-items: center; gap: 13px; width: 100%; min-height: 66px; padding: 11px 13px; background: var(--card) !important; border: 1.5px solid var(--line) !important; border-radius: 14px; transition: border-color .15s, background .15s; }
@media (hover: hover) { #fhq .fh-opt:hover { border-color: var(--moss) !important; } }
#fhq .fh-opt.on { border-color: var(--forest) !important; background: var(--sage-soft) !important; box-shadow: inset 0 0 0 1px var(--forest); }
#fhq .fh-opt svg.fh-ill { width: 56px; height: 56px; flex: none; border-radius: 11px; }
#fhq .fh-opt-t { flex: 1; min-width: 0; display: block; }
#fhq .fh-opt-t b { display: block; font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--ink); }
#fhq .fh-opt-t small { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
#fhq .fh-tick { width: 22px; height: 22px; flex: none; border: 1.5px solid #B9B4A3; border-radius: 50%; display: grid; place-items: center; }
#fhq .fh-opts.multi .fh-tick { border-radius: 6px; }
#fhq .fh-opt.on .fh-tick { background: var(--forest); border-color: var(--forest); }
#fhq .fh-opt.on .fh-tick::after { content: ''; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
#fhq .fh-q .fh-btn { margin-top: 18px; }

/* Reading screen */
#fhq .fh-read { min-height: 560px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; background: var(--forest-deep); color: #FFFDF8; }
#fhq .fh-read svg { width: 200px; height: 90px; overflow: visible; }
#fhq .fh-read svg path { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: fh-grow 2s ease-in-out forwards; }
@keyframes fh-grow { to { stroke-dashoffset: 0; } }
#fhq .fh-read h2 { font-size: 26px; margin-top: 16px; color: #FFFDF8; }
#fhq .fh-read-sub { margin-top: 6px; font-size: 14.5px; color: #B9C6B4; }
#fhq .fh-read ul { list-style: none; display: grid; gap: 13px; width: 100%; max-width: 300px; margin: 26px auto 0; text-align: right; }
#fhq .fh-read li { display: flex; align-items: center; gap: 11px; font-size: 15.5px; font-weight: 500; color: #D7E0D2; opacity: .35; transition: opacity .3s, color .3s; }
#fhq .fh-read li i { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; transition: background .3s, border-color .3s; }
#fhq .fh-read li.on { opacity: 1; color: #FFFDF8; }
#fhq .fh-read li.on i { border-color: var(--gold); border-top-color: transparent; animation: fh-spin .8s linear infinite; }
#fhq .fh-read li.done { opacity: 1; color: #FFFDF8; }
#fhq .fh-read li.done i { background: var(--gold); border-color: var(--gold); }
#fhq .fh-read li.done i::after { content: ''; width: 5px; height: 10px; border: solid var(--forest-deep); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
@keyframes fh-spin { to { transform: rotate(360deg); } }

#fhq .fh-r-head { background: var(--forest-deep); color: #FFFDF8; padding: 26px 20px 22px; }
#fhq .fh-ready { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px; border-radius: 100px; background: rgba(199, 161, 95, .16); color: var(--gold); font-size: 13px; font-weight: 700; }
#fhq .fh-ready::before { content: ''; width: 4px; height: 8px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-1px); }
#fhq .fh-r-head h2 { font-size: clamp(25px, 7vw, 31px); line-height: 1.3; margin-top: 12px; color: #FFFDF8; }
#fhq .fh-r-sub { margin-top: 6px; font-size: 15px; line-height: 1.6; color: #C9D5C4; }
#fhq .fh-map { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
#fhq .fh-z { padding: 10px 10px 9px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); }

#fhq .fh-chips span { font-size: 12.5px; padding: 3px 9px; background: var(--sage-soft); border-radius: 6px; color: var(--forest-deep); direction: ltr; }
#fhq .fh-sec h3 { font-size: 21px; margin-bottom: 8px; color: var(--ink); }
#fhq .fh-list { list-style: none; display: grid; gap: 8px; }
#fhq .fh-list li { position: relative; padding-right: 22px; font-size: 15px; line-height: 1.55; }
#fhq .fh-list li::before { content: ''; position: absolute; right: 2px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--moss); }
#fhq .fh-steps { list-style: none; display: grid; gap: 10px; counter-reset: s; }
#fhq .fh-steps li { counter-increment: s; display: flex; gap: 11px; font-size: 15px; line-height: 1.55; }
#fhq .fh-steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sage); color: var(--forest-deep); display: grid; place-items: center; font-size: 13.5px; font-weight: 700; }
#fhq .fh-steps b { font-weight: 700; }
#fhq .fh-alt { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; text-decoration: none !important; color: var(--ink) !important; }

#fhq .fh-alt img { width: 62px; height: 62px; flex: none; object-fit: contain; background: #fff; border-radius: 9px; }
#fhq .fh-alt div { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
#fhq .fh-alt b { display: block; font-size: 15px; font-weight: 700; color: var(--ink); }
#fhq .fh-alt em { font-style: normal; font-weight: 700; color: var(--forest); white-space: nowrap; font-size: 14.5px; }
#fhq .fh-doc { font-size: 13.5px; line-height: 1.55; padding: 10px 12px; background: var(--clay-soft); border-radius: 8px; color: #6E2F1D; }
#fhq .fh-trust { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13.5px; font-weight: 600; text-align: center; color: var(--forest-deep); }
#fhq .fh-trust span { padding: 9px 6px; border: 1px solid var(--line); border-radius: 9px; }
#fhq .fh-again { display: block; margin: 0 auto 6px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; color: var(--muted) !important; text-decoration: underline; text-underline-offset: 3px; }
#fhq .fh-buy { position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
#fhq .fh-buy .fh-btn { width: 100%; max-width: 420px; min-height: 54px; font-size: 16.5px; padding: 10px 16px; animation: fh-pulse 2s ease-out infinite; }

@media (prefers-reduced-motion: reduce) {
  #fhq *, #fhq *::before, #fhq *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>

      (why.length ? '<div class="fh-sec"><h3>لماذا هذا الاختيار؟</h3><ul class="fh-list">' + why.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="fh-sec"><h3>ماذا سيفعل لشعرك؟</h3><ul class="fh-list">' + p.does.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>' +
      '<div class="fh-sec"><h3>طريقة الاستعمال</h3><ol class="fh-steps">' + p.how.map(function (x) { return '<li><span>' + x + '</span></li>'; }).join('') + '</ol></div>' +
      (alts ? '<div class="fh-sec"><h3>' + altTitle + '</h3>' + alts + '</div>' : '') +
      doc +
      '<div class="fh-trust"><span>الدفع عند الاستلام</span><span>التوصيل لكل الولايات</span></div>' +
      '<button type="button" class="fh-again" data-go="restart">إعادة التشخيص</button>' +
      '</div>' +
      '<div class="fh-buy"><a class="fh-btn" id="fhBuy" href="' + link(p, k) + '" data-alt="' + k + '"><span>' + g('اطلبي', 'اطلب') + ' ' + p.short + ' الآن</span><b>' + dz(p.price) + '</b>' + ARROW + '</a></div>' +
      '</section>';
    delete shell.dataset.q;
    track('HairQuizResult', { result: k });
    view();
  }

  shell.addEventListener('click', function (e) {
    var opt = e.target.closest('.fh-opt');
    if (opt) { pick(opt); return; }
    var buy = e.target.closest('[data-alt]');
    if (buy) { track('HairQuizProductClick', { result: result, product: buy.dataset.alt }); return; }
    var go = e.target.closest('[data-go]');
    if (!go || go.disabled) return;
    clearTimeout(timer);
    var act = go.dataset.go;
    if (act === 'start') { track('HairQuizStart'); hist = []; renderQuestion(0); }
    if (act === 'next') advance();
    if (act === 'back') {
      peak = 0;
      if (hist.length) renderQuestion(hist.pop()); else renderLanding();
    }
    if (act === 'restart') { renderLanding(); view(); }
  });

  renderLanding();
  window.FloreHairQuiz = { recommend: recommend, diagnose: diagnose, QUESTIONS: QUESTIONS, PRODUCTS: PRODUCTS };
})();
</script>

</body>
</html>
